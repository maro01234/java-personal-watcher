spring.application.name=java-personal-watcher
server.address=127.0.0.1
server.port=${PORT:8080}
watcher.db=${WATCHER_DB:./data/watcher.db}
watcher.scheduler-delay-ms=10000
vaadin.launch-browser=false
spring.main.banner-mode=off
watcher.auth.required=${WATCHER_AUTH_REQUIRED:false}
watcher.auth.password=${WATCHER_AUTH_PASSWORD:}
watcher.auth.password-file=${WATCHER_AUTH_PASSWORD_FILE:}
